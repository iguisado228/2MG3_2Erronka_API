name: CI - Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
          cache: true
          cache-dependency-path: |
            2Erronka_API/2Erronka_API/Erronka2Api.csproj

      - name: Restore
        run: dotnet restore 2Erronka_API/2Erronka_API/Erronka2Api.csproj

      - name: Build
        run: dotnet build 2Erronka_API/2Erronka_API/Erronka2Api.csproj -c Release --no-restore

      - name: Test
        run: dotnet test 2Erronka_API/2Erronka_API/Erronka2Api.csproj -c Release --no-build
